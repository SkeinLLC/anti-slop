name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Lint the docs with anti-slop itself
        run: node bin/antislop.js lint README.md CHANGELOG.md docs/*.md --fail-on error --format github
